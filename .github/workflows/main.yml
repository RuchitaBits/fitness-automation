name: ACEest CI/CD

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Syntax validation
        run: python -m compileall -q .
      - name: Ruff quality check
        run: python -m ruff check app.py tests
      - name: Unit tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag aceest-fitness-devops:${{ github.sha }} .

  container-tests:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --tag aceest-fitness-devops:test .
      - name: Run pytest inside container
        run: docker run --rm aceest-fitness-devops:test python -m pytest -q
      - name: Verify health endpoint
        run: |
          docker run --detach --name aceest-app -p 5000:5000 aceest-fitness-devops:test
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:5000/health
          docker rm --force aceest-app