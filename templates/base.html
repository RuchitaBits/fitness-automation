<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ACEest Fitness & Gym{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="nav"><a class="brand" href="{{ url_for('index') }}">ACE<span>est</span></a>{% if session.get('user_id') %}<div class="nav-links"><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('clients') }}">Clients</a><a href="{{ url_for('programs') }}">Programs</a><a href="{{ url_for('workouts') }}">Workouts</a><a href="{{ url_for('logout') }}">Log out</a></div>{% else %}<a href="{{ url_for('login') }}">Staff login</a>{% endif %}</nav>
  <main class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body>
</html>
