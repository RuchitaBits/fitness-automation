---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-service
spec:
  selector:
    app.kubernetes.io/name: aceest-ab
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: aceest-ab-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: aceest-ab-service
spec:
  host: aceest-ab-service
  subsets:
    - name: a
      labels:
        version: a
    - name: b
      labels:
        version: b
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: aceest-ab
spec:
  hosts:
    - "*"
  gateways:
    - aceest-ab-gateway
  http:
    - match:
        - headers:
            x-aceest-group:
              exact: beta
      route:
        - destination:
            host: aceest-ab-service
            subset: b
    - route:
        - destination:
            host: aceest-ab-service
            subset: a
